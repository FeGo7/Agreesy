<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="glowCoral" cx="43%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#F06449" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F06449" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="57%" cy="60%" r="36%">
      <stop offset="0%" stop-color="#5C9BD6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#5C9BD6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="topCross">
      <rect x="210" y="110" width="92" height="120"/>
    </clipPath>
    <clipPath id="botCross">
      <rect x="210" y="282" width="92" height="120"/>
    </clipPath>
    <mask id="whiteUnderCoralMask">
      <rect width="512" height="512" fill="#FFF"/>
      <g clip-path="url(#topCross)">
        <circle cx="308" cy="256" r="102" stroke="#000" stroke-width="50"/>
      </g>
    </mask>
    <mask id="coralUnderWhiteMask">
      <rect width="512" height="512" fill="#FFF"/>
      <g clip-path="url(#botCross)">
        <circle cx="204" cy="256" r="102" stroke="#000" stroke-width="50"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1B212E"/>
  <rect width="512" height="512" rx="112" fill="url(#glowCoral)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowBlue)"/>
  <circle cx="204" cy="256" r="102" stroke="#EEF2F7" stroke-width="34" mask="url(#whiteUnderCoralMask)"/>
  <circle cx="308" cy="256" r="102" stroke="#F06449" stroke-width="34" mask="url(#coralUnderWhiteMask)"/>
</svg>
